[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tokenizer"
version = "0.1.0"
description = "A UTF-8 BPE tokenizer written in Rust"
readme = "README.md"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "tokenizer/Cargo.toml"
features = ["python"]
module-name = "tokenizer"
